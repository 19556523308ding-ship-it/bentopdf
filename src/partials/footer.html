{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="border-t border-slate-200/80 py-14 bg-white/70 backdrop-blur-md">
  <div class="container mx-auto px-4 max-w-5xl">
    <div class="flex flex-col md:flex-row items-center justify-between gap-8 text-center md:text-left">
      <div class="flex flex-col items-center md:items-start">
        <div class="flex items-center mb-3">
          <img
            id="footer-logo"
            src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
            alt="{{#if brandName}}{{brandName}}{{else}}BankPDF{{/if}} Logo"
            class="h-9 w-9 mr-3"
          />
          <span id="footer-brand" class="text-2xl font-extrabold text-slate-900 tracking-tight">{{#if brandName}}{{brandName}}{{else}}BankPDF{{/if}}</span>
        </div>
        <p id="footer-copyright" class="text-slate-600 text-sm font-normal" {{#unless footerText}}data-i18n="footer.copyright"{{/unless}}>
          {{#if footerText}}{{footerText}}{{else}}&copy; 2026 BankPDF. 保留所有权利。{{/if}}
        </p>
        <p class="text-slate-400 text-xs mt-1.5 font-mono">
          <span data-i18n="footer.version">版本</span>
          <span id="app-version">{{appVersion}}</span>
        </p>
      </div>

      <div class="flex items-center gap-8 md:gap-12 text-sm font-semibold">
        <a
          href="/about"
          class="text-slate-700 hover:text-teal-700 transition-colors py-1"
          data-i18n="footer.aboutUs"
          >About Us</a
        >
        <a
          href="/faq"
          class="text-slate-700 hover:text-teal-700 transition-colors py-1"
          data-i18n="footer.faqLink"
          >FAQ</a
        >
        <a
          href="/contact"
          class="text-slate-700 hover:text-teal-700 transition-colors py-1"
          data-i18n="footer.contactUs"
          >Contact Us</a
        >
      </div>
    </div>
  </div>
</footer>
{{/if}}
