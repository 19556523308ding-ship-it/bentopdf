{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="border-t border-slate-200/80 py-12 bg-white/60 backdrop-blur-sm">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-center md:text-left max-w-4xl mx-auto">
      <div class="mb-6 md:mb-0">
        <div class="flex items-center justify-center md:justify-start mb-4">
          <img
            id="footer-logo"
            src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
            alt="{{#if brandName}}{{brandName}}{{else}}BankPDF{{/if}} Logo"
            class="h-10 w-10 mr-3"
          />
          <span id="footer-brand" class="text-xl font-bold text-slate-900">{{#if brandName}}{{brandName}}{{else}}BankPDF{{/if}}</span>
        </div>
        <p id="footer-copyright" class="text-slate-600 text-sm" {{#unless footerText}}data-i18n="footer.copyright"{{/unless}}>
          {{#if footerText}}{{footerText}}{{else}}&copy; 2026 BankPDF. 保留所有权利。{{/if}}
        </p>
        <p class="text-slate-500 text-xs mt-2">
          <span data-i18n="footer.version">版本</span>
          <span id="app-version">{{appVersion}}</span>
        </p>
      </div>

      <div class="md:pl-12">
        <h3 class="font-bold text-slate-900 mb-4 text-base" data-i18n="footer.company">
          Company
        </h3>
        <ul class="space-y-3 text-slate-600 font-medium">
          <li>
            <a
              href="/about"
              class="hover:text-teal-700 transition-colors"
              data-i18n="footer.aboutUs"
              >About Us</a
            >
          </li>
          <li>
            <a
              href="/faq"
              class="hover:text-teal-700 transition-colors"
              data-i18n="footer.faqLink"
              >FAQ</a
            >
          </li>
          <li>
            <a
              href="/contact"
              class="hover:text-teal-700 transition-colors"
              data-i18n="footer.contactUs"
              >Contact Us</a
            >
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>
{{/if}}
